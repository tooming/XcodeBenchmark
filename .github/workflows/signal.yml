name: signal
on:
  workflow_dispatch:
    inputs:
      runner-label:
        required: true
        type: string
      runs:
        required: false
        type: string
        default: '3'
jobs:
  signal:
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: codemagic-ci-cd/Signal-iOS-Benchmark
          ref: 93a9394b554ef183cf3f4a892da1ef8f162d77fb
          submodules: false
      - name: Environment
        run: |
          echo "label: ${{ inputs.runner-label }}"; xcodebuild -version; sysctl hw.ncpu hw.memsize; sw_vers -productVersion
          xcrun simctl list runtimes 2>&1 | head -5; cat .ruby-version
      - name: Ruby per .ruby-version (untimed)
        run: |
          brew install rbenv ruby-build 2>&1 | tail -2
          export PATH="$(brew --prefix rbenv)/bin:$PATH"; eval "$(rbenv init - bash)"
          RUBY_CONFIGURE_OPTS="--with-openssl-dir=$(brew --prefix openssl@3)" rbenv install -s "$(cat .ruby-version)" 2>&1 | tail -3
          rbenv local "$(cat .ruby-version)"; ruby -v
      - name: make dependencies (untimed)
        run: |
          unset XCODE_XCCONFIG_FILE CCACHE_REMOTE_STORAGE SCCACHE_WEBDAV_ENDPOINT SCCACHE_WEBDAV_KEY_PREFIX BUILD_CACHE_URL GOCACHEPROG
          s=$(date +%s); make dependencies 2>&1 | tail -15; echo "make dependencies: $(( $(date +%s)-s )) s"
      - name: bundle install (untimed)
        run: |
          export PATH="$(brew --prefix rbenv)/bin:$PATH"; eval "$(rbenv init - bash)"
          bundle config path vendor/bundle
          s=$(date +%s); bundle install --jobs 4 --retry 3 2>&1 | tail -5; echo "bundle install: $(( $(date +%s)-s )) s"
      - name: Timed scan x runs, memory sampled
        run: |
          set +e
          export PATH="$(brew --prefix rbenv)/bin:$PATH"; eval "$(rbenv init - bash)"
          unset XCODE_XCCONFIG_FILE CCACHE_REMOTE_STORAGE SCCACHE_WEBDAV_ENDPOINT SCCACHE_WEBDAV_KEY_PREFIX BUILD_CACHE_URL GOCACHEPROG
          export CCACHE_DISABLE=1
          MEM="$RUNNER_TEMP/mem.csv"; echo "t,free_pct,swap_used_mb,pageouts" > "$MEM"
          ( while true; do
              f=$(memory_pressure -Q 2>/dev/null | grep -Eo '[0-9]+%' | head -1 | tr -d %)
              sw=$(sysctl -n vm.swapusage | sed -E 's/.*used = ([0-9.]+)M.*/\1/')
              po=$(vm_stat | awk '/Pageouts/{gsub("\\.","",$2);print $2}')
              echo "$(date +%s),$f,$sw,$po" >> "$MEM"; sleep 10; done ) &
          SAMP=$!
          echo "### Signal, ${{ inputs.runner-label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| run | scan seconds | exit |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 ${{ inputs.runs }}); do
            echo "=== run $i start $(date -u +%T)"; vm_stat | head -4; sysctl vm.swapusage
            s=$(date +%s)
            bundle exec fastlane scan --scheme Signal --output_types junit --skip_package_dependencies_resolution --disable_package_automatic_updates --derived_data_path "$RUNNER_TEMP/dd-signal-$i" --xcargs "-test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 COMPILATION_CACHE_ENABLE_CACHING=NO" > "$RUNNER_TEMP/scan-$i.log" 2>&1
            rc=$?; e=$(date +%s)
            echo "| $i | $((e-s)) | $rc |" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "--- run $i: first 8 lines"; head -8 "$RUNNER_TEMP/scan-$i.log"; echo "--- last 40 lines"; tail -40 "$RUNNER_TEMP/scan-$i.log"
            vm_stat | head -4; sysctl vm.swapusage
          done
          kill $SAMP
          echo "## memory sampled every 10 s: samples=$(($(wc -l < "$MEM")-1))"
          awk -F, 'NR>1&&$2!=""{if(min==""||$2<min)min=$2} NR>1&&$3+0>mx{mx=$3+0} NR>1&&NR==2{po0=$4} END{print "min free% = " min "; max swap used MB = " mx "; pageouts delta = " ($4-po0)}' "$MEM"
          echo "## memory csv"; cat "$MEM"
