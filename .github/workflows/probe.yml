name: probe
on:
  workflow_dispatch:
    inputs:
      runner-label:
        required: true
        type: string
jobs:
  probe:
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 15
    steps:
      - name: Xcode inventory
        run: |
          echo "label: ${{ inputs.runner-label }}"
          echo "## ls /Applications | grep -i xcode"; ls /Applications | grep -i xcode
          echo "## xcodes"; (command -v xcodes && xcodes list --installed 2>&1 | head -20) || echo "xcodes not installed"
          echo "## xcode-select -p"; xcode-select -p
          echo "## DEVELOPER_DIR=$DEVELOPER_DIR"
          echo "## each Xcode"; for x in /Applications/Xcode*.app; do echo "$x: $(DEVELOPER_DIR=$x/Contents/Developer xcodebuild -version 2>&1 | tr '\n' ' ')"; done
          echo "## ruby/bundler/make/git"; ruby -v; bundle -v 2>&1; make -v | head -1; cat /Users/runner/.ruby-version 2>/dev/null; command -v rbenv chruby asdf fio || true
      - name: Memory and CPU sysctl
        run: |
          sysctl hw.memsize hw.l2cachesize hw.l1dcachesize hw.cachelinesize hw.ncpu 2>&1
          sysctl hw.perflevel0.l2cachesize 2>&1
          vm_stat | head -5; sysctl vm.swapusage
      - name: Disk throughput (4 GiB, uncached)
        run: |
          df -h "$RUNNER_TEMP" | tail -1
          python3 - <<'PY'
          import os, time, fcntl, sys
          p = os.path.join(os.environ["RUNNER_TEMP"], "disk.bin")
          blk = b"\0" * (8 << 20); n = 512  # 4 GiB
          fd = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          fcntl.fcntl(fd, 48, 1)  # F_NOCACHE
          t = time.time()
          for _ in range(n): os.write(fd, blk)
          os.fsync(fd); os.close(fd)
          w = time.time() - t
          fd = os.open(p, os.O_RDONLY); fcntl.fcntl(fd, 48, 1)
          t = time.time()
          while os.read(fd, 8 << 20): pass
          r = time.time() - t; os.close(fd); os.remove(p)
          print(f"seq write: {4096/w:.0f} MB/s ({w:.1f}s)   seq read: {4096/r:.0f} MB/s ({r:.1f}s)")
          PY
