name: bench
on:
  workflow_dispatch:
    inputs:
      runner-label:
        description: Runner label (e.g. avrea-macos-26-8-vcpu)
        required: true
        type: string
      caching:
        description: on = Avrea defaults, off = all caches disabled
        type: choice
        options: [off, on]
        default: off
jobs:
  bench:
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Hardware
        run: |
          echo "label: ${{ inputs.runner-label }}"
          sw_vers; sysctl hw.model hw.ncpu hw.memsize; xcodebuild -version
      - name: Ensure iOS platform (untimed)
        run: |
          if ! xcodebuild -showsdks | grep -q iphoneos; then xcodebuild -downloadPlatform iOS; fi
      - name: Benchmark
        run: |
          CACHE_FLAG=""
          if [ "${{ inputs.caching }}" = "off" ]; then
            unset XCODE_XCCONFIG_FILE
            unset CCACHE_REMOTE_STORAGE SCCACHE_WEBDAV_ENDPOINT SCCACHE_WEBDAV_KEY_PREFIX BUILD_CACHE_URL BUILD_CACHE_TELEMETRY_ENABLED GOCACHEPROG
            export CCACHE_DISABLE=1
            CACHE_FLAG="COMPILATION_CACHE_ENABLE_CACHING=NO"
          fi
          echo "caching=${{ inputs.caching }} XCODE_XCCONFIG_FILE='${XCODE_XCCONFIG_FILE}' flag='$CACHE_FLAG'"
          echo "### caching=${{ inputs.caching }}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### ${{ inputs.runner-label }}"
            echo "| kind | run | wall seconds | xcodebuild [N sec] (parsed) |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "## XCODE_XCCONFIG_FILE=$XCODE_XCCONFIG_FILE"; cat "$XCODE_XCCONFIG_FILE" 2>&1 || true
          echo "## cache build settings"
          xcodebuild -workspace XcodeBenchmark.xcworkspace -scheme XcodeBenchmark -destination generic/platform=iOS $CACHE_FLAG -showBuildSettings 2>/dev/null | grep -i cache || echo "(no cache-related build settings)"
          xcodebuild -workspace XcodeBenchmark.xcworkspace -scheme XcodeBenchmark -destination generic/platform=iOS $CACHE_FLAG -showBuildSettings 2>/dev/null | grep -i COMPILATION_CACHE_ENABLE_CACHING || echo "COMPILATION_CACHE_ENABLE_CACHING: not set"
          build() { # kind run dd
            local start end log="$RUNNER_TEMP/log-$1-$2.txt"
            start=$(date +%s)
            script -q /dev/null xcodebuild -workspace XcodeBenchmark.xcworkspace -scheme XcodeBenchmark \
              -destination generic/platform=iOS $CACHE_FLAG -derivedDataPath "$3" build > "$log" 2>&1
            local rc=$?
            end=$(date +%s)
            local own
            own=$(grep -Eo 'BUILD SUCCEEDED \*\* \[[0-9.]+ sec\]' "$log" | tail -1 | grep -Eo '[0-9.]+ sec' || true)
            [ -n "$own" ] || own="n/a"
            echo "| $1 | $2 | $((end-start)) | $own |" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$1" = clean ]; then
              echo "--- $1 $2 first 3 lines"; head -3 "$log"
              echo "--- $1 $2 last 3 lines"; tail -3 "$log"
            fi
            [ $rc -eq 0 ] || { tail -30 "$log"; exit 1; }
          }
          for i in 1 2 3 4 5; do build clean $i "$RUNNER_TEMP/dd-$i"; done
          for i in 1 2 3 4 5; do
            touch Source/EnvironmentCheck.swift
            build incremental $i "$RUNNER_TEMP/dd-5"
          done
